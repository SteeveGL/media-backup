# S3 Backup Configuration
# Specify your bucket name and the directories to backup

s3_bucket: "my-backup-bucket"  # Change this to your S3 bucket name

# Whether to skip errors and continue with other backups (default: false)
skip_errors: false

# List of directories to backup
backups:
  - source: "/path/to/photos"
    destination: "photos"  # S3 path (optional, defaults to directory name)
    exclude:
      - "*.tmp"
      - ".thumbs"

  - source: "/path/to/documents"
    destination: "docs"
    exclude:
      - ".git"
      - "node_modules"

  - source: "/path/to/videos"
    # No destination specified - will use directory name
    exclude:
      - "*.partial"
